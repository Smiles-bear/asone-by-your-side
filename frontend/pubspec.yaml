name: azruiyoi_community
description: "Azruiyoi community edition: local persistence, user-configured API chat, group chat, import and recent-conversation diary."
publish_to: 'none'
version: 0.3.7+10

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  asone_contracts:
    path: packages/asone_contracts
  asone_demo_core:
    path: packages/asone_demo_core
  collection: ^1.19.1
  cryptography: ^2.9.0
  dio: ^5.7.0
  file_picker: 11.0.3
  fl_chart: ^0.68.0
  flutter_markdown: ^0.7.4
  flutter_reorderable_grid_view: 5.7.0
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  path_provider: ^2.1.5
  pdf_document: ^4.0.0
  pdf_graphics: ^4.0.0
  phosphoricons_flutter: ^1.0.0
  shared_preferences: ^2.3.3
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: 2.3.6
  sqlite3: 2.9.4

dependency_overrides:
  objective_c: 9.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/calendar/
    - assets/features/
    - assets/icons/
    - assets/legal/
    - assets/navigation/
    - assets/sticky/
